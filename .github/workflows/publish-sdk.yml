# Publishes @arcveildev/sdk from a tag, with npm provenance.
#
# Provenance is the reason this runs in CI rather than from a laptop: npm
# records a signed attestation binding the published tarball to this workflow,
# this repository and the exact commit. For a package whose whole claim is that
# you can check it yourself rather than trust us, an unverifiable tarball would
# be the wrong artifact to ship.
#
# Release: git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
name: Publish SDK

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for provenance: lets npm mint the attestation for this run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: the action reads packageManager from
      # package.json, and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The gates the repository already keeps. A package that fails its own
      # test suite must not reach the registry, where the version is permanent.
      - run: pnpm --filter @arcveildev/sdk typecheck
      - run: pnpm --filter @arcveildev/sdk test
      - run: pnpm --filter @arcveildev/sdk build

      # 0.1.0 shipped extensionless relative imports and could not be imported
      # from Node at all — it only worked inside a bundler. Nothing in the unit
      # tests could see that, because they run on the source. This packs the
      # real tarball and imports it the way a stranger would.
      - name: Import the packed tarball from a clean Node project
        run: |
          set -euo pipefail
          TARBALL="$(pwd)/$(npm pack --silent)"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install "$TARBALL" viem >/dev/null
          node --input-type=module -e "
            import { RECEIPT_VERSION, arc, verifyReceipts } from '@arcveildev/sdk';
            if (RECEIPT_VERSION !== 1) throw new Error('unexpected receipt version');
            if (arc.id !== 5042) throw new Error('unexpected chain id');
            if (typeof verifyReceipts !== 'function') throw new Error('verifyReceipts missing');
            console.log('import from Node: ok');
          "
        working-directory: packages/sdk

      - run: npm publish --provenance --access public
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
