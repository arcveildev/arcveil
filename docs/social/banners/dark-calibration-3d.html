<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcveil — six thresholds, all six wrong</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="dark-banner.css">
<style>
  /* Same series, one departure: the right side is a render rather than CSS
     plates. Everything that carries a number stays type, so a wrong figure is
     still a one-line fix — only the scenery is a raster.

     Two corrections the raster forced. It bleeds full frame, because a plate
     sized to part of the canvas shows its own edges: the render is pure black
     and the canvas is #0e0e0e, and that seam is visible. And it is hue-shifted
     onto the brand accent — the render came back emerald, and this series
     allows one green. */
  .render{position:absolute;inset:0;background:url("plate-dark-calibration.png") center/cover no-repeat;
          filter:hue-rotate(-30deg) saturate(.82) brightness(1.04)}
  .scrim{position:absolute;inset:0;
         background:linear-gradient(to right, var(--surface) 0%, var(--surface) 28%,
                                    rgba(14,14,14,.74) 44%, transparent 60%)}
  .eyebrow,h1,.sub,.figures,.note,.lockup,.traced{z-index:1}

  .sub{top:566px}
  .figures{position:absolute;left:96px;top:648px;display:flex;gap:84px}
  .figures .n{font-weight:800;font-size:76px;line-height:1;letter-spacing:-.03em}
  .figures .n.good{color:var(--accent)}
  .figures .n.moved{color:var(--amber)}
  .figures .l{margin-top:14px;font-family:"DM Mono",monospace;font-size:17px;
              letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
  .note{bottom:210px}
</style>
</head>
<body>
  <div class="render"></div>
  <div class="scrim"></div>
  <div class="eyebrow"><svg viewBox="0 0 28 24" fill="none"><path d="M3.1 10.5A11 11 0 0 1 24.9 10.5L18.77 10.5A5 5 0 0 0 9.23 10.5Z" fill="currentColor"/><rect x="3" y="14" width="6" height="9" fill="currentColor"/><rect x="19" y="14" width="6" height="9" fill="currentColor"/><rect y="11.25" width="28" height="2" fill="#85ed75"/></svg><span>Calibration</span></div>
  <h1 class="small">Caught every attack. <em>And almost everything else.</em></h1>
  <div class="sub"><span>500 labelled proposals</span><b>·</b><span>161 held out</span></div>

  <div class="figures">
    <div><div class="n good">0</div><div class="l">attacks through · of 102</div></div>
    <div><div class="n moved">54 &rarr; 5</div><div class="l">honest refused · of 59</div></div>
  </div>

  <div class="note">A gate that blocks everything is not a safe gate.<br>It is one you switch off by Friday.</div>
  <div class="lockup"><svg viewBox="0 0 28 24" fill="none"><path d="M3.1 10.5A11 11 0 0 1 24.9 10.5L18.77 10.5A5 5 0 0 0 9.23 10.5Z" fill="currentColor"/><rect x="3" y="14" width="6" height="9" fill="currentColor"/><rect x="19" y="14" width="6" height="9" fill="currentColor"/><rect y="11.25" width="28" height="2" fill="#85ed75"/></svg><span>Arcveil</span></div>
  <div class="traced"><i>Measured on</i><b>495 of 500 · reported on the holdout</b></div>
</body>
</html>
