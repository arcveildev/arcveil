    <rect x="120" y="120" width="40" height="9" fill="#1a1a1a"/><text x="123" y="127">LOAD BAL.</text>
    <rect x="236" y="212" width="36" height="9" fill="#1a1a1a"/><text x="239" y="219">KV CACHE</text>
    <rect x="150" y="232" width="30" height="9" fill="#1a1a1a"/><text x="153" y="239">TOKENS</text>
