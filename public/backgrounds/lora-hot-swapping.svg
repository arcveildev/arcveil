<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" fill="none">
  <g stroke="#3f3f3f" stroke-width="1">
    <!-- isometric grid plane on top -->
    <path d="M210 20 L300 65 L210 110 L120 65 Z"/>
    <path d="M150 50 L240 95 M180 35 L270 80 M240 35 L150 80 M270 50 L180 95"/>
    <!-- base plane -->
    <path d="M210 150 L360 225 L210 300 L60 225 Z" stroke="#4a4a4a"/>
  </g>
  <!-- adapter (diamond) hovering over base model -->
  <path d="M210 160 L280 195 L210 230 L140 195 Z" fill="#1a1a1a" stroke="#6e6e6e"/>
  <path d="M210 182 L236 195 L210 208 L184 195 Z" fill="#ffffff"/>
  <!-- vertical link with arrow -->
  <path d="M210 110 V150" stroke="#6e6e6e" stroke-dasharray="2 3"/>
  <path d="M210 230 V262" stroke="#6e6e6e"/>
  <path d="M205 257 L210 264 L215 257" stroke="#6e6e6e"/>
  <!-- base model cube -->
  <g stroke="#8a8a8a" stroke-width="1">
    <path d="M195 266 L210 258 L225 266 L225 286 L210 294 L195 286 Z" fill="#0e0e0e"/>
    <path d="M195 266 L210 274 L225 266 M210 274 V294"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="8" fill="#6e6e6e">
    <text x="300" y="70">LoRA ADAPTERS</text>
    <text x="300" y="200">HOT-SWAP</text>
    <text x="236" y="285">BASE MODEL</text>
  </g>
  <circle cx="236" cy="195" r="2" fill="#85ed75"/>
</svg>
